<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>审核后台 · 猫和老鼠点位</title>
  <link rel="icon" type="image/png" href="/static/images/mice/莱恩.png">
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="admin-body">

<header class="site-header">
  <div class="header-inner">
    <h1 class="logo">点位审核后台</h1>
    <nav class="header-nav">
      <button class="nav-icon-btn" id="darkToggle" aria-label="切换深色模式">
        <svg class="icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/>
        </svg>
      </button>
      <button class="btn-ghost" id="logoutBtn">退出登录</button>
    </nav>
  </div>
</header>

<main class="container">
  <header class="page-header">
    <h1 class="page-title">审核后台</h1>
    <p class="page-sub">审核玩家投稿</p>
  </header>

  <nav class="admin-tabs">
    <button class="chip active" data-status="pending">待审核</button>
    <button class="chip" data-status="approved">已审核</button>
  </nav>

  <!-- 列表视图 -->
  <section id="listPanel">
    <div class="list-toolbar">
      <div class="layer-label" id="listLabel">待审核条目</div>
      <button class="btn-ghost" id="approveAllBtn" hidden>全部通过</button>
    </div>
    <div class="admin-list" id="adminList">
      <div class="loading-text">加载中...</div>
    </div>
  </section>
</main>

<div class="modal-mask" id="lightbox" hidden>
  <div class="lightbox glass">
    <button class="modal-close" id="closeLightbox" aria-label="关闭">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="上一张">‹</button>
    <img id="lbImg" src="" alt="原图预览">
    <button class="lb-nav lb-next" id="lbNext" aria-label="下一张">›</button>
    <p id="lbTitle" class="lightbox-title"></p>
    <p id="lbDesc" class="lightbox-desc" hidden></p>
  </div>
</div>

<!-- 编辑点位弹窗 -->
<div class="modal-mask" id="editModal" hidden>
  <div class="modal glass">
    <button class="modal-close" id="closeEdit" aria-label="关闭">✕</button>
    <h2 class="modal-title">编辑点位</h2>
    <form id="editForm" novalidate>
      <div class="form-group">
        <label>分类</label>
        <select name="category_l1" id="eCat" required><option value="">请选择</option></select>
      </div>
      <div class="form-group">
        <label>地图主题</label>
        <select name="map_group_l2" id="eGroup" required disabled><option value="">先选分类</option></select>
      </div>
      <div class="form-group">
        <label>具体地图（可多选）</label>
        <p class="form-hint">同一主题下的地图点位通用，可同时关联多张地图</p>
        <div class="map-check-grid" id="eMapList">
          <p class="form-hint">请先选择地图主题</p>
        </div>
      </div>
      <div class="form-group">
        <label>标题</label>
        <input type="text" name="title" id="eTitle" maxlength="60" required>
      </div>
      <div class="form-group">
        <label>点位描述（选填）</label>
        <textarea name="description" id="eDesc" rows="3" maxlength="300" placeholder="补充说明该点位（可选）"></textarea>
      </div>
      <div class="form-group">
        <label>投稿人</label>
        <input type="text" name="submitter" id="eSubmitter" maxlength="30" required>
      </div>
      <div class="form-group">
        <label>投稿人邮箱</label>
        <input type="email" name="submitter_email" id="eEmail" required>
      </div>
      <div class="form-msg" id="eMsg" hidden></div>
      <button type="submit" class="btn-primary" id="eSaveBtn">保存</button>
    </form>
  </div>
</div>

<script>
let currentStatus = 'pending';
let editId = null;
let editingRow = null;
let currentRows = [];

const $ = (s) => document.querySelector(s);
const listEl = $('#adminList');
const labelEl = $('#listLabel');
const approveAllBtn = $('#approveAllBtn');
const listPanel = $('#listPanel');

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'form-msg ' + (type || '');
  el.hidden = false;
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || '请求失败');
  return data.data;
}

async function loadList(status) {
  currentStatus = status;
  document.querySelectorAll('.admin-tabs .chip').forEach(b =>
    b.classList.toggle('active', b.dataset.status === status));

  listPanel.hidden = false;
  approveAllBtn.hidden = status !== 'pending';

  listEl.innerHTML = '<div class="loading-text">加载中...</div>';
  labelEl.textContent = status === 'pending' ? '待审核条目' : '已审核条目';

  const res = await fetch('/admin/pending?status=' + status);
  if (res.status === 401) { location.href = '/admin'; return; }
  const data = await res.json();
  if (!data.ok) { listEl.innerHTML = '<div class="loading-text">加载失败</div>'; return; }

  const rows = data.data;
  currentRows = rows;
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">暂无记录</div>';
    return;
  }
  listEl.innerHTML = rows.map((r, i) => {
    const imgCount = r.images && r.images.length ? r.images.length : 1;
    return `
    <div class="admin-card glass animate-fadeInUp grid-item-${(i % 8) + 1}" data-id="${r.id}">
      <div class="admin-thumb-wrap">
        <img class="admin-thumb" src="${esc(r.thumb_url)}" alt="缩略图" loading="lazy">
        ${imgCount > 1 ? `<span class="multi-badge">×${imgCount}</span>` : ''}
      </div>
      <div class="admin-info">
        <div class="admin-title">${esc(r.title)}</div>
        <div class="admin-meta">${esc(r.category_l1)} · ${esc(r.map_group_l2)} · ${esc((r.maps && r.maps.length ? r.maps : [r.map_name_l3]).join(' / '))}</div>
        ${r.tags ? `<div class="admin-meta">标签：${esc(r.tags)}</div>` : ''}
        ${r.description ? `<div class="admin-meta">描述：${esc(r.description)}</div>` : ''}
        ${r.submitter ? `<div class="admin-meta">投稿人：${esc(r.submitter)}</div>` : ''}
        <div class="admin-meta">投稿时间：${esc(r.created_at)}</div>
        ${r.submitter_email ? `<div class="admin-meta">邮箱：${esc(r.submitter_email)}</div>` : ''}
      </div>
      <div class="admin-actions">
        <button class="btn-ghost" onclick="openEdit(${r.id})">编辑</button>
        ${status === 'pending' ? `
        <button class="btn-ok" onclick="act(${r.id},'approve')">通过</button>
        <button class="btn-no" onclick="act(${r.id},'reject')">拒绝</button>` : ''}
        <button class="btn-no" onclick="del(${r.id})">删除</button>
      </div>
    </div>`;
  }).join('');
}

async function act(id, action) {
  let body = null;
  if (action === 'reject') {
    const reason = prompt('请输入拒绝原因（选填，将发送给投稿人）：');
    if (reason === null) return; // 用户取消
    body = new URLSearchParams();
    body.set('reason', reason.trim());
  }
  const res = await fetch('/admin/' + action + '/' + id, { method: 'POST', body });
  const data = await res.json();
  if (!data.ok) { alert(data.error || '操作失败'); return; }
  loadList(currentStatus);
}

async function del(id) {
  if (!confirm('确定删除该点位？删除后不可恢复。')) return;
  const res = await fetch('/admin/delete/' + id, { method: 'POST' });
  const data = await res.json();
  if (!data.ok) { alert(data.error || '删除失败'); return; }
  loadList(currentStatus);
}

/* ---------------- 编辑点位 ---------------- */

function openEdit(id) {
  editingRow = currentRows.find(x => x.id === id);
  if (!editingRow) return;
  editId = id;
  $('#eTitle').value = editingRow.title || '';
  $('#eDesc').value = editingRow.description || '';
  $('#eSubmitter').value = editingRow.submitter || '';
  $('#eEmail').value = editingRow.submitter_email || '';
  $('#eMsg').hidden = true;
  $('#eMsg').className = 'form-msg';
  $('#editModal').hidden = false;
  initEditSelects();
}

async function initEditSelects() {
  try {
    const cats = await getJSON('/api/categories');
    const eCat = $('#eCat');
    eCat.innerHTML = '<option value="">请选择</option>' +
      cats.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
    eCat.value = editingRow.category_l1;
    fillEditGroups();
  } catch (e) {
    showMsg($('#eMsg'), '加载分类失败', 'error');
  }
}

async function fillEditGroups() {
  const g = $('#eGroup');
  const mList = $('#eMapList');
  if (!$('#eCat').value) { g.disabled = true; mList.innerHTML = '<p class="form-hint">请先选择地图主题</p>'; return; }
  g.disabled = false;
  mList.innerHTML = '<p class="form-hint">请先选择地图主题</p>';
  g.innerHTML = '<option value="">加载中...</option>';
  try {
    const groups = await getJSON('/api/groups?l1=' + encodeURIComponent($('#eCat').value));
    g.innerHTML = '<option value="">请选择</option>' +
      groups.map(x => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');
    g.value = editingRow.map_group_l2;
    fillEditMaps();
  } catch (e) { g.innerHTML = '<option value="">加载失败</option>'; }
}

function renderEditMapChecks(maps) {
  const checked = new Set(editingRow.maps || [editingRow.map_name_l3]);
  $('#eMapList').innerHTML = maps.map(m => `
    <label class="map-check-item">
      <input type="checkbox" value="${esc(m.name)}" ${checked.has(m.name) ? 'checked' : ''}>
      <span class="map-check-thumb">
        ${m.thumb ? `<img src="${esc(m.thumb)}" alt="${esc(m.name)}" loading="lazy">` : '<span class="map-card-placeholder"></span>'}
      </span>
      <span class="map-check-name">${esc(m.name)}</span>
    </label>`).join('');
}

async function fillEditMaps() {
  const mList = $('#eMapList');
  if (!$('#eGroup').value) { mList.innerHTML = '<p class="form-hint">请先选择地图主题</p>'; return; }
  mList.innerHTML = '<p class="form-hint">加载中...</p>';
  try {
    const maps = await getJSON('/api/maps?l1=' + encodeURIComponent($('#eCat').value) +
      '&l2=' + encodeURIComponent($('#eGroup').value));
    renderEditMapChecks(maps);
  } catch (e) { mList.innerHTML = '<p class="form-hint">加载失败</p>'; }
}

$('#eCat').addEventListener('change', () => {
  $('#eGroup').disabled = true;
  $('#eMapList').innerHTML = '<p class="form-hint">请先选择地图主题</p>';
  fillEditGroups();
});
$('#eGroup').addEventListener('change', () => fillEditMaps());

$('#closeEdit').addEventListener('click', () => { $('#editModal').hidden = true; });
$('#editModal').addEventListener('click', (e) => {
  if (e.target === $('#editModal')) $('#editModal').hidden = true;
});

$('#editForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('#eMsg');
  msg.hidden = true;

  if (!$('#eCat').value || !$('#eGroup').value) {
    showMsg(msg, '请选择分类和地图主题', 'error');
    return;
  }
  const checkedMaps = Array.from($('#eMapList').querySelectorAll('input[type="checkbox"]:checked'))
    .map(c => c.value);
  if (!checkedMaps.length) {
    showMsg(msg, '请至少选择一个具体地图', 'error');
    return;
  }
  if (!$('#eTitle').value.trim()) {
    showMsg(msg, '请填写标题', 'error');
    return;
  }
  if (!$('#eSubmitter').value.trim()) {
    showMsg(msg, '请填写投稿人', 'error');
    return;
  }
  if (!$('#eEmail').value.trim()) {
    showMsg(msg, '请填写投稿人邮箱', 'error');
    return;
  }

  const fd = new FormData();
  fd.append('category_l1', $('#eCat').value);
  fd.append('map_group_l2', $('#eGroup').value);
  checkedMaps.forEach(m => fd.append('map_names_l3', m));
  fd.append('title', $('#eTitle').value.trim());
  fd.append('description', $('#eDesc').value.trim());
  fd.append('submitter', $('#eSubmitter').value.trim());
  fd.append('submitter_email', $('#eEmail').value.trim());

  const btn = $('#eSaveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';
  try {
    const res = await fetch('/admin/edit/' + editId, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.ok) {
      $('#editModal').hidden = true;
      loadList(currentStatus);
    } else {
      showMsg(msg, data.error || '保存失败', 'error');
    }
  } catch (err) {
    showMsg(msg, '网络错误，请重试', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '保存';
  }
});

$('#logoutBtn').addEventListener('click', async () => {
  await fetch('/admin/logout', { method: 'POST' });
  location.href = '/admin';
});

document.querySelectorAll('.admin-tabs .chip').forEach(b =>
  b.addEventListener('click', () => loadList(b.dataset.status)));

approveAllBtn.addEventListener('click', async () => {
  if (!confirm('确定全部通过当前所有待审核条目？')) return;
  const res = await fetch('/admin/approve_all', { method: 'POST' });
  const data = await res.json();
  if (!data.ok) { alert(data.error || '操作失败'); return; }
  loadList(currentStatus);
});

/* ---------------- 看大图（点击卡片查看完整图，多图可左右翻页） ---------------- */

  let lbItems = [];   // [{ src, title, desc }]
  let lbIndex = 0;

  function lockBodyScroll(lock) {
    document.body.style.overflow = lock ? 'hidden' : '';
  }

  // 打开某条投稿的完整图查看器
  function openLbFor(row) {
    const imgs = (row.images && row.images.length) ? row.images : [{ original: row.original_url }];
    lbItems = imgs.map(im => ({ src: im.original, title: row.title, desc: row.description || '' }));
    lbIndex = 0;
    renderLb();
    $('#lightbox').hidden = false;
    lockBodyScroll(true);
  }

  function renderLb() {
    const item = lbItems[lbIndex] || { src: '', title: '', desc: '' };
    $('#lbImg').src = item.src;
    $('#lbTitle').textContent = lbItems.length > 1
      ? `${item.title}（${lbIndex + 1}/${lbItems.length}）` : item.title;
    const desc = $('#lbDesc');
    if (item.desc) {
      desc.textContent = item.desc;
      desc.hidden = false;
    } else {
      desc.textContent = '';
      desc.hidden = true;
    }
    $('#lbPrev').hidden = lbItems.length <= 1;
    $('#lbNext').hidden = lbItems.length <= 1;
  }

  function lbStep(delta) {
    lbIndex = (lbIndex + delta + lbItems.length) % lbItems.length;
    renderLb();
  }

  function closeLb() {
    $('#lightbox').hidden = true;
    lockBodyScroll(false);
  }

  // 点击卡片任意位置（操作按钮除外）查看完整图
  listEl.addEventListener('click', (e) => {
    if (e.target.closest('button')) return;   // 编辑/通过/拒绝/删除按钮不触发
    const card = e.target.closest('.admin-card');
    if (!card) return;
    const row = currentRows.find(r => r.id === Number(card.dataset.id));
    if (row) openLbFor(row);
  });

  $('#closeLightbox').addEventListener('click', closeLb);
  $('#lightbox').addEventListener('click', (e) => {
    if (e.target === $('#lightbox')) closeLb();
  });
  $('#lbPrev').addEventListener('click', (e) => { e.stopPropagation(); lbStep(-1); });
  $('#lbNext').addEventListener('click', (e) => { e.stopPropagation(); lbStep(1); });
  document.addEventListener('keydown', (e) => {
    if ($('#lightbox').hidden) return;
    if (e.key === 'ArrowLeft') lbStep(-1);
    else if (e.key === 'ArrowRight') lbStep(1);
    else if (e.key === 'Escape') closeLb();
  });

loadList('pending');
</script>
</body>
</html>
