<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>审核后台 · 猫和老鼠点位</title>
  <link rel="icon" type="image/png" href="/static/images/mice/莱恩.png">
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="admin-body">

<header class="site-header">
  <div class="header-inner">
    <h1 class="logo">点位审核后台</h1>
    <nav class="header-nav">
      <button class="nav-icon-btn" id="darkToggle" aria-label="切换深色模式">
        <svg class="icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg class="icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/>
        </svg>
      </button>
      <button class="btn-ghost" id="logoutBtn">退出登录</button>
    </nav>
  </div>
</header>

<main class="container">
  <header class="page-header">
    <h1 class="page-title">审核后台</h1>
    <p class="page-sub">审核玩家投稿</p>
  </header>

  <nav class="admin-tabs">
    <button class="chip active" data-status="pending">待审核</button>
    <button class="chip" data-status="approved">已审核</button>
    <button class="chip" data-status="rejected">已拒绝</button>
  </nav>

  <!-- 分类筛选条：按 一级分类 / 地图主题 筛选投稿，方便快速定位 -->
  <div class="admin-filters">
    <select id="filterCat" aria-label="按分类筛选">
      <option value="">全部分类</option>
    </select>
    <select id="filterGroup" aria-label="按地图主题筛选" disabled>
      <option value="">全部主题</option>
    </select>
    <button type="button" class="btn-ghost" id="filterReset">重置</button>
  </div>

  <!-- 列表视图 -->
  <section id="listPanel">
    <div class="list-toolbar">
      <div class="layer-label" id="listLabel">待审核条目</div>
      <button class="btn-ghost" id="approveAllBtn" hidden>全部通过</button>
    </div>
    <div class="admin-list" id="adminList">
      <div class="loading-text">加载中...</div>
    </div>
  </section>
</main>

<div class="modal-mask" id="lightbox" hidden>
  <div class="lightbox glass">
    <button class="modal-close" id="closeLightbox" aria-label="关闭">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="上一张">‹</button>
    <img id="lbImg" src="" alt="原图预览">
    <button class="lb-nav lb-next" id="lbNext" aria-label="下一张">›</button>
    <p id="lbTitle" class="lightbox-title"></p>
    <p id="lbDesc" class="lightbox-desc" hidden></p>
    <a id="lbOriginal" class="lightbox-original" href="#" target="_blank" rel="noopener noreferrer" hidden>查看原图 ↗</a>
  </div>
</div>

<!-- 编辑点位弹窗 -->
<div class="modal-mask" id="editModal" hidden>
  <div class="modal glass">
    <button class="modal-close" id="closeEdit" aria-label="关闭">✕</button>
    <h2 class="modal-title">编辑点位</h2>
    <form id="editForm" novalidate>
      <div class="form-group">
        <label>分类</label>
        <select name="category_l1" id="eCat" required><option value="">请选择</option></select>
      </div>
      <div class="form-group">
        <label>地图主题</label>
        <select name="map_group_l2" id="eGroup" required disabled><option value="">先选分类</option></select>
      </div>
      <div class="form-group">
        <label>具体地图（可多选）</label>
        <p class="form-hint">同一主题下的地图点位通用，可同时关联多张地图</p>
        <div class="map-check-grid" id="eMapList">
          <p class="form-hint">请先选择地图主题</p>
        </div>
      </div>
      <div class="form-group">
        <label>标题</label>
        <input type="text" name="title" id="eTitle" maxlength="60" required>
      </div>
      <div class="form-group">
        <label>点位描述（选填）</label>
        <textarea name="description" id="eDesc" rows="3" maxlength="300" placeholder="补充说明该点位（可选）"></textarea>
      </div>
      <div class="form-group">
        <label>投稿人</label>
        <input type="text" name="submitter" id="eSubmitter" maxlength="30" required>
      </div>
      <div class="form-group">
        <label>投稿人邮箱</label>
        <input type="email" name="submitter_email" id="eEmail" required>
      </div>
      <div class="form-msg" id="eMsg" hidden></div>
      <button type="submit" class="btn-primary" id="eSaveBtn">保存</button>
    </form>
  </div>
</div>

<script type="module" src="/static/js/admin.js"></script>
</body>
</html>
